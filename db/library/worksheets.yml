# The worksheet catalog. Each entry is one parameterised printable sheet,
# keyed by a STABLE code (never renumber; append new codes). `skill` links
# the sheet to a curriculum skill so the catalog can be filtered by the
# child's progress. `level`: 1 starter, 2 growing, 3 confident.
#
# All sheets are generated at print time via WorksheetBuilder — no files,
# no third-party material.

